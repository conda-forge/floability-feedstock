schema_version: 1

context:
  name: floability
  version: 0.3.1
  python_min: "3.11"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://github.com/floability/floability-cli/archive/refs/tags/v0.3.1.tar.gz
  sha256: 756caa952138d2443a9c75b1ebe4eae8cd30ff174fed28f684ab295e0274d800

build:
  number: 0
  noarch: python
  script: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_FLOABILITY=${{ version }} ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools_scm >=8
    - wheel
  run:
    - python >=${{ python_min }}
    - boto3
    - botocore
    - conda-pack
    - jupyter
    - jupyter_client
    - nbformat
    - ndcctools
    - pelicanfs
    - pyyaml
    - requests
    - tqdm
    - xrootd

tests:
  - python:
      imports:
        - floability
        - yaml
      python_version: 
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - floability --version
      - floability --help
      - python -c "import floability; assert floability.__version__ == '${{ version }}'"
      - vine_factory --version
      - vine_worker --version

about:
  summary: Deploy portable TaskVine workflow backpacks on HPC systems
  license: GPL-2.0-only
  license_file: COPYING
  homepage: https://floability.github.io/
  repository: https://github.com/floability/floability-cli
  documentation: https://floability.readthedocs.io/

extra:
  recipe-maintainers:
    - saifulislampi
    - btovar
    - dthain
